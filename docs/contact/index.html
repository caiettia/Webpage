    <main class="main-safe flex-1 w-full" id="main-content" tabindex="-1" role="main">
        <div class="page-wrapper">
            <div class="contact-page-modern mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-start">
                    <div>
                        <h1 class="text-3xl sm:text-4xl font-bold text-surface-900 dark:text-slate-100 tracking-tight">Contact Me</h1>
                        <p class="mt-4 text-slate-600 dark:text-slate-300 text-lg">
                            If you would like to get in touch, please reach out here or on my socials. I look forward to hearing from you.
                        </p>
                        <div class="mt-8 flex gap-4">
                            <a href="https://www.linkedin.com/in/andrew-caietti-817a78177/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-brand-500 hover:text-white transition-colors" aria-label="LinkedIn">
                                <i class="fab fa-linkedin text-xl"></i>
                            </a>
                            <a href="https://github.com/caiettia" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-surface-900 dark:hover:bg-brand-500 hover:text-white transition-colors" aria-label="GitHub">
                                <i class="fab fa-github text-xl"></i>
                            </a>
                        </div>
                    </div>
                    <div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/80 p-6 sm:p-8 shadow-sm">
                        <form method="post" action="https://formspree.io/f/mleajrzq" class="space-y-4">
                            <div>
                                <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Your name</label>
                                <input type="text" id="name" name="name" autocomplete="name" required placeholder="Your Name" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-surface-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-shadow">
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Your email</label>
                                <input type="email" id="email" name="email" autocomplete="email" required placeholder="your@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-surface-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-shadow">
                            </div>
                            <div>
                                <label for="message" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1">Message</label>
                                <textarea id="message" name="message" required placeholder="Your message..." rows="5" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-surface-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-shadow resize-y"></textarea>
                            </div>
                            <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 rounded-xl text-base font-semibold text-white bg-surface-900 dark:bg-brand-500 hover:bg-surface-800 dark:hover:bg-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:focus:ring-offset-slate-950 transition-colors">
                                Send message
                            </button>
                        </form>
                    </div>
                </div>
